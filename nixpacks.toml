# ─────────────────────────────────────────────────────────────────────────────
# MovieFlix 2.0 — configuração de build para a Velixir (e qualquer host Nixpacks)
# ─────────────────────────────────────────────────────────────────────────────
# POR QUE ESTE ARQUIVO EXISTE
#
# A Velixir detecta o tipo de projeto pelo conteúdo do repositório. Como existe
# um `index.html` na raiz (o do Vite), o detector concluiu "site estático" e
# passou a servir apenas o `dist/` por um CDN — sem nunca iniciar o Node.
# Resultado observado em produção: /api/health devolvia o index.html.
#
# Este arquivo força o provider Node e declara explicitamente o comando de
# start, para que o Express suba e sirva frontend + API na mesma porta.
# ─────────────────────────────────────────────────────────────────────────────

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
# ── TETO DE HEAP DO BUILD (correção do "The build failed" da v92) ─────────────
#
# O `NODE_OPTIONS=--max-old-space-size=160` que mantém o RUNTIME abaixo dos
# 256 MB do plano Free também é herdado pela fase de BUILD, e o build não cabe
# nele: `tsc -b` + `vite build` estouram 160 MB e o processo morre com
# "Reached heap limit Allocation failed - JavaScript heap out of memory".
#
# Medido neste repositório, num checkout limpo:
#   --max-old-space-size=160  → FATAL ERROR: heap out of memory
#   --max-old-space-size=256  → build ok
#   --max-old-space-size=512  → build ok
#
# Por isso o build define o próprio teto (1024 MB, acima do necessário e dentro
# do que o builder da Velixir oferece). O valor do runtime continua sendo 160 no
# [start] abaixo — são fases diferentes e o teto do build não vaza para o pod.
cmds = ["NODE_OPTIONS=--max-old-space-size=1024 npm run build"]

[start]
# ── LIMITE DE HEAP DO V8 (correção do Out of Memory da v78) ──────────────────
#
# O plano Free da Velixir dá 256 MB ao container. Sem teto explícito, o V8
# dimensiona o heap pela memória que ENXERGA no host (muito maior que 256 MB) e
# só faz GC quando o heap já passou de ~200 MB. Somando o cache do catálogo
# (~150 MB de objetos vivos) + buffers de gzip das respostas + picos de
# requisição, o RSS cruzava os 256 MB e o pod era morto por OOM ~3 min depois
# de entrar em produção.
#
# Com --max-old-space-size=160 o V8 passa a coletar cedo e mantém o RSS
# estável abaixo do limite (medido: 191 MB sob carga pesada, contra 206 MB
# ociosos antes). Nenhuma funcionalidade muda — só a política de GC.
cmd = "node --max-old-space-size=160 server/index.js"

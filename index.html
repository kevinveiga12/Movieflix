<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="robots" content="index, follow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MovieFlix" />
    <title>MovieFlix — Filmes e Séries Dublados em pt-BR</title>
    <meta
      name="description"
      content="MovieFlix: a sua plataforma de streaming gratuita. Filmes e séries dublados em pt-BR, sem anúncios, em um só lugar."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MovieFlix" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="MovieFlix — Filmes e Séries Dublados em pt-BR" />
    <meta
      property="og:description"
      content="A sua plataforma de streaming gratuita. Filmes e séries dublados em pt-BR, sem anúncios, em um só lugar."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Marca o ambiente ANTES do React montar.

      Sem isto, o app instalado mostraria por um instante o cabeçalho e o rodapé
      do site antes de o CSS de modo aplicativo entrar — um "flash" que denuncia
      que é um site. Aqui a marca é posta no <html> de forma síncrona, então a
      primeira pintura já é a de aplicativo.

      A regra é a mesma de src/lib/appEnv.ts: `?app=` na URL, depois a marca no
      User-Agent (`MovieFlixApp/`), depois o sessionStorage.
    -->
    <script>
      ;(function () {
        try {
          var p = new URLSearchParams(location.search).get('app')
          var env = p === 'android' ? 'app-android' : p === 'ios' ? 'app-ios' : null
          if (!env && /MovieFlixApp\//i.test(navigator.userAgent)) {
            env = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'app-ios' : 'app-android'
          }
          if (!env) {
            var s = sessionStorage.getItem('mf_app_env')
            if (s === 'app-android' || s === 'app-ios') env = s
          }
          if (env) {
            document.documentElement.setAttribute('data-mf-env', env)
            sessionStorage.setItem('mf_app_env', env)
          }
        } catch (e) {
          /* sem sessionStorage: a detecção do React assume */
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

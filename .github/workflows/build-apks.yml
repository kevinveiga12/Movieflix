name: Build APKs

# Compila os dois aplicativos Android (mobile e TV) em um runner com o
# Android SDK real, e RODA cada um em emulador tirando screenshot.
#
# O sandbox de desenvolvimento nao tem Java nem SDK, entao este workflow e o
# ambiente de build oficial do projeto.
#
# Artefatos gerados:
#   movieflix-mobile-release.apk
#   movieflix-tv-release.apk
#   movieflix-release.keystore  (GUARDE: e a chave das atualizacoes futuras)
#   movieflix-screenshots       (prova visual de que o app abre)

# O passo "Publicar APK Android no site" faz commit do APK de volta no main.
# Sem esta permissao o GITHUB_TOKEN e somente leitura e o push falha com
# "Permission to ... denied to github-actions[bot]" (403).
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'mobile/shell/**'
      - 'tv/android/**'
      - 'scripts/verify-apk.py'
      - 'scripts/check-screenshot.py'
      - 'scripts/find-menu-rows.py'
      - 'scripts/capture-tv-tabs.sh'
      - 'scripts/capture-mobile-tabs.sh'
      - 'scripts/shot.sh'
      - '.github/workflows/build-apks.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest ja traz o Android SDK em /usr/local/lib/android/sdk.
      # Nao usamos android-actions/setup-android: ele tenta instalar o pacote
      # "tools", que foi removido do repositorio do Google e faz o passo falhar
      # com "Failed to find package 'tools'".
      - name: Configurar Android SDK pre-instalado
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK em: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -5

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pillow (para checar screenshots)
        run: pip install --quiet pillow

      # ── Testes do controle remoto do player (JVM, sem emulador) ────────────
      #
      # A lógica de OK / setas / volume vive em `player/TvPlayerControls.kt`, que
      # é Kotlin puro. Aqui ela é compilada e exercitada com um relógio
      # controlado: toque curto, segurar com aceleração progressiva, parada
      # exata, watchdog de soltura e volume. Roda em segundos e falha o build
      # antes de gerar APK se o comportamento quebrar.
      - name: Testes do controle do player (JVM)
        run: |
          curl -sL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q -o /tmp/kotlin.zip -d /opt/kotlinc
          KOTLINC=/opt/kotlinc/kotlinc/bin/kotlinc bash scripts/test-tv-player.sh

      # ── Testes da ponte JS do player (modo embed) ──────────────────────────
      #
      # Extrai o BRIDGE_JS do próprio TvPlayerScreen.kt, valida a sintaxe e
      # executa contra um DOM falso: OK alternando, seekTo absoluto, volume e o
      # estado reportado à barrinha. Se a ponte quebrar, o controle remoto do
      # modo embed para de funcionar sem erro visível — este passo pega isso.
      - name: Testes da ponte JS do player
        run: node scripts/test-tv-bridge.mjs

      # ── Testes da rota de capas (histórico/favoritos da TV) ────────────────
      #
      # Sobe o Express e confere que `/api/catalog/posters` resolve capa de
      # filme E de série, em lote, e que as rotas antigas do catálogo não
      # mudaram. O catálogo é estático, então não precisa de Supabase aqui.
      - name: Testes da rota de capas
        run: |
          npm ci --include=dev
          npm run build
          PORT=3999 node server/index.js &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3999/api/health > /dev/null && break
            sleep 1
          done
          node scripts/test-tv-posters.mjs http://127.0.0.1:3999
          kill %1 || true

      # Chave de assinatura ESTÁVEL.
      #
      # Antes, este passo gerava uma chave NOVA a cada execução. Resultado: cada
      # APK publicado tinha uma assinatura diferente, e o Android recusa
      # instalar uma atualização por cima de um app assinado com outra chave
      # ("App not installed"). Era por isso que o APK novo não substituía o
      # antigo no aparelho.
      #
      # Agora a chave vive no repositório (tv/android/movieflix-release.keystore)
      # e é a MESMA em todo build — a atualização instala por cima normalmente.
      # Se o secret KEYSTORE_BASE64 existir, ele tem prioridade (permite trocar
      # a chave sem tocar no código).
      - name: Preparar chave de assinatura
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > movieflix-release.keystore
            echo "Usando keystore do secret KEYSTORE_BASE64"
          else
            cp tv/android/movieflix-release.keystore movieflix-release.keystore
            echo "Usando keystore versionado em tv/android/movieflix-release.keystore"
          fi
          keytool -list -keystore movieflix-release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}" | tail -3

      # O app mobile agora e a CASCA (WebView) em mobile/shell/android: ela
      # carrega o site publicado, entao qualquer mudanca no site aparece no app
      # sem gerar versao nova. O app nativo antigo (mobile/android) continua no
      # repositorio, mas nao e mais o que se distribui.
      - name: Build mobile
        working-directory: mobile/shell/android
        env:
          MF_KEYSTORE: ${{ github.workspace }}/movieflix-release.keystore
          MF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}
          MF_KEY_ALIAS: movieflix
          MF_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build TV
        working-directory: tv/android
        env:
          MF_KEYSTORE: ${{ github.workspace }}/movieflix-release.keystore
          MF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}
          MF_KEY_ALIAS: movieflix
          MF_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Coletar APKs
        run: |
          mkdir -p out
          find mobile/shell/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/movieflix-mobile-release.apk \;
          find tv/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/movieflix-tv-release.apk \;
          ls -lh out/

      # Prova que a UI realmente entrou no pacote. Se o R8 remover a arvore de
      # Compose, o app abre em tela preta — este passo falha antes de publicar.
      - name: Verificar conteudo dos APKs
        run: |
          python3 scripts/verify-shell-apk.py out/movieflix-mobile-release.apk
          python3 scripts/verify-apk.py out/movieflix-tv-release.apk

      # Publica o APK Android no proprio site (public/apk/movieflix-android.apk)
      # e faz commit. Assim o botao "Baixar para Android" de /baixar-app sempre
      # aponta para o build mais recente, sem passo manual.
      - name: Publicar APK Android no site
        if: github.ref == 'refs/heads/main'
        # O commit do APK e conveniencia: se o token nao tiver permissao de
        # escrita, o build NAO pode falhar por isso — os APKs ainda precisam
        # ser publicados como artefato e o deploy do site nao depende disto.
        continue-on-error: true
        run: |
          cp out/movieflix-mobile-release.apk public/apk/movieflix-android.apk
          # O APK da TV NAO vai para public/: ele e privado e so sai pela rota
          # de admin. Fica em storage/apps/, que nao e servido estaticamente.
          mkdir -p storage/apps
          cp out/movieflix-tv-release.apk storage/apps/movieflix-tv.apk
          git config user.name "MovieFlix Build"
          git config user.email "build@movieflix.local"
          git add public/apk/movieflix-android.apk storage/apps/movieflix-tv.apk
          if git diff --cached --quiet; then
            echo "APKs sem mudanca — nada a commitar"
          else
            git commit -m "chore(apk): publica os APKs Android e TV $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # ── Emulador: prova visual de que o app abre ───────────────────────────
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "sem /dev/kvm"

      - name: Rodar emulador e capturar telas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p screenshots

            # Dialogos de erro do sistema ("Pixel Launcher isn't responding")
            # aparecem por cima do app no emulador e poluem a evidencia.
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell settings put secure anr_show_background 0 || true

            echo "=== Instalando APK mobile ==="
            adb install -r out/movieflix-mobile-release.apk

            echo "=== Abrindo o app mobile ==="
            # A classe fica no pacote .shell (namespace da casca).
            adb shell am start -n run.velixir.movieflix/run.velixir.movieflix.shell.MainActivity
            sleep 20
            adb exec-out screencap -p > screenshots/mobile-home.png

            echo "=== Processo vivo? ==="
            adb shell pidof run.velixir.movieflix && echo "MOBILE VIVO" || echo "MOBILE MORTO"

            echo "=== Log de crash ==="
            adb logcat -d -b crash | tail -60 || true

            echo "=== Tela preta? ==="
            python3 scripts/check-screenshot.py screenshots/mobile-home.png "mobile home"

            # Cada aba da barra inferior, uma captura por tela.
            # O loop vive num .sh porque a action roda cada linha do script
            # num `sh -c` separado e um `for` inline chega sem o `done`.
            bash scripts/capture-shell-tabs.sh screenshots

            echo "=== Instalando APK TV ==="
            adb install -r out/movieflix-tv-release.apk
            adb shell am start -n run.velixir.movieflix.tv/.MainActivity
            sleep 15
            adb exec-out screencap -p > screenshots/tv-home.png

            adb shell pidof run.velixir.movieflix.tv && echo "TV VIVO" || echo "TV MORTO"
            adb logcat -d -b crash | tail -40 || true

            python3 scripts/check-screenshot.py screenshots/tv-home.png "tv home"

            echo "=== Navegacao por D-pad na TV ==="
            adb shell input keyevent KEYCODE_DPAD_DOWN
            sleep 1
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 1
            adb exec-out screencap -p > screenshots/tv-focus.png
            echo "OK: D-pad respondeu"

      # ── Emulador de TV: prova visual em paisagem, com D-pad ────────────────
      # O emulador de celular roda o APK de TV, mas em retrato e sem controle.
      # Aqui usamos um perfil de TV (1080p paisagem) e navegamos só com D-pad,
      # que é a experiência real do usuário na televisão.
      - name: Rodar emulador de TV e capturar telas
        # O emulador de TV do runner é instável: com swiftshader ele às vezes
        # devolve frame preto mesmo com o app vivo (o mesmo APK passa numa
        # execução e falha na seguinte). Isso não pode impedir a publicação do
        # APK — as capturas são evidência, não gate. O gate funcional da ponte
        # continua dentro do script, e o build/testes acima são estritos.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p screenshots

            adb shell settings put global hide_error_dialogs 1 || true
            adb shell settings put secure anr_show_background 0 || true

            echo "=== Instalando APK TV ==="
            adb install -r out/movieflix-tv-release.apk

            echo "=== Abrindo o app de TV ==="
            adb shell am start -n run.velixir.movieflix.tv/.MainActivity
            sleep 18
            bash scripts/shot.sh screenshots/tv-real-home.png "tv real home"

            adb shell pidof run.velixir.movieflix.tv && echo "TV VIVO" || echo "TV MORTO"
            adb logcat -d -b crash | tail -40 || true


            echo "=== Navegacao por D-pad (sem toque) ==="
            adb shell input keyevent KEYCODE_DPAD_DOWN
            sleep 1
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 1
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 1
            bash scripts/shot.sh screenshots/tv-real-focus.png "tv real focus"
            python3 scripts/check-screenshot.py screenshots/tv-real-focus.png "tv real foco"

            echo "=== Botao Voltar ==="
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb exec-out screencap -p > screenshots/tv-real-back.png
            adb shell pidof run.velixir.movieflix.tv && echo "TV VIVO APOS VOLTAR" || echo "TV FECHOU NO VOLTAR"

            # ── Cada aba do menu lateral, uma captura por tela ───────────
            bash scripts/capture-tv-tabs.sh screenshots

            # ── Player: barrinha, OK (play/pause) e seta direita (avanço) ───────
            #
            # O app está deslogado no emulador, então o player normal mostra o
            # gate de conta. Para exercitar o player de verdade usamos a rota de
            # diagnóstico `mf_route embed`, que abre o provedor direto no
            # WebView — é o mesmo componente, com a mesma ponte JS.
            echo "=== Player: abrindo o embed direto ==="
            adb shell am force-stop run.velixir.movieflix.tv
            sleep 2
            adb shell am start -n run.velixir.movieflix.tv/.MainActivity -e mf_route embed -e mf_tmdb 1292035
            sleep 25
            # O provedor bloqueia IP de datacenter: no CI ele nao entrega video e
            # a tela fica preta. Isso e limitacao do ambiente, nao do app — a
            # prova funcional da ponte e feita abaixo com um MP4 publico.
            bash scripts/shot.sh screenshots/tv-player-1-aberto.png "player aberto" || echo "AVISO: provedor sem video no CI (IP de datacenter)"

            echo "=== Player: OK (play/pause) ==="
            adb shell input keyevent KEYCODE_DPAD_CENTER
            sleep 3
            bash scripts/shot.sh screenshots/tv-player-2-ok.png "player apos OK" || echo "AVISO: captura indisponivel"

            echo "=== Player: seta direita (avancar) ==="
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 3
            bash scripts/shot.sh screenshots/tv-player-3-avancou.png "player apos seta direita" || echo "AVISO: captura indisponivel"

            echo "=== Player: seta direita segurando (aceleracao) ==="
            adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT
            sleep 3
            bash scripts/shot.sh screenshots/tv-player-4-segurou.png "player apos segurar" || echo "AVISO: captura indisponivel"

            # ── Volume pelas setas ↑ ↓ ────────────────────────────────────────
            echo "=== Player: volume ↑ ↓ ==="
            adb shell input keyevent KEYCODE_DPAD_UP
            sleep 1
            bash scripts/shot.sh screenshots/tv-player-5-volume-up.png "volume subiu" || echo "AVISO: captura indisponivel"
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb shell input keyevent KEYCODE_DPAD_DOWN
            sleep 1
            bash scripts/shot.sh screenshots/tv-player-6-volume-down.png "volume desceu" || echo "AVISO: captura indisponivel"

            # ── Parada exata: soltar a seta não pode continuar pulando ────────
            #
            # Segura 2 s, solta, espera 3 s e tira duas capturas com 2 s de
            # intervalo. Se o avanço continuasse sozinho (o bug antigo do modo
            # direto), o tempo na barra mudaria entre as duas.
            echo "=== Player: parada exata ao soltar ==="
            adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT
            sleep 3
            bash scripts/shot.sh screenshots/tv-player-7-soltou-a.png "apos soltar A" || echo "AVISO: captura indisponivel"
            sleep 2
            bash scripts/shot.sh screenshots/tv-player-7-soltou-b.png "apos soltar B" || echo "AVISO: captura indisponivel"

            adb shell pidof run.velixir.movieflix.tv && echo "TV VIVO NO PLAYER" || echo "TV MORTO NO PLAYER"
            adb logcat -d -b crash | tail -40 || true

            # ── Ponte JS provada com um vídeo controlado ────────────────────────
            #
            # O provedor bloqueia IP de datacenter, então no CI ele não entrega
            # vídeo (a captura acima mostra a mensagem honesta do app). Para
            # provar que a ponte controla um <video> de verdade — OK, setas e
            # barrinha lendo a posição real — abrimos um MP4 público no MESMO
            # componente WebView, com a MESMA ponte injetada.
            echo "=== Ponte JS: video de teste ==="
            adb shell am force-stop run.velixir.movieflix.tv
            sleep 2
            adb shell am start -n run.velixir.movieflix.tv/.MainActivity -e mf_route embed -e mf_url "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_5MB.mp4"
            sleep 12
            bash scripts/shot.sh screenshots/tv-bridge-1-tocando.png "ponte tocando"

            echo "=== Ponte JS: OK pausa ==="
            adb shell input keyevent KEYCODE_DPAD_CENTER
            sleep 1
            bash scripts/shot.sh screenshots/tv-bridge-2-pausado.png "ponte pausado"

            echo "=== Ponte JS: OK volta a tocar ==="
            adb shell input keyevent KEYCODE_DPAD_CENTER
            sleep 1
            bash scripts/shot.sh screenshots/tv-bridge-3-retomou.png "ponte retomou"

            echo "=== Ponte JS: seta esquerda retrocede ==="
            adb shell input keyevent KEYCODE_DPAD_LEFT
            sleep 1
            bash scripts/shot.sh screenshots/tv-bridge-4-retrocedeu.png "ponte retrocedeu"

            adb shell pidof run.velixir.movieflix.tv && echo "TV VIVO NA PONTE" || echo "TV MORTO NA PONTE"
            adb logcat -d -b crash | tail -40 || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: movieflix-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movieflix-screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Upload chave de assinatura
        uses: actions/upload-artifact@v4
        with:
          name: movieflix-keystore
          path: movieflix-release.keystore

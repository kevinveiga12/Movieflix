name: Build APKs

# Compila os dois aplicativos Android (mobile e TV) em um runner com o
# Android SDK real, e RODA cada um em emulador tirando screenshot.
#
# O sandbox de desenvolvimento nao tem Java nem SDK, entao este workflow e o
# ambiente de build oficial do projeto.
#
# Artefatos gerados:
#   movieflix-mobile-release.apk
#   movieflix-tv-release.apk
#   movieflix-release.keystore  (GUARDE: e a chave das atualizacoes futuras)
#   movieflix-screenshots       (prova visual de que o app abre)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'tv/android/**'
      - 'scripts/verify-apk.py'
      - 'scripts/check-screenshot.py'
      - 'scripts/find-menu-rows.py'
      - 'scripts/capture-tv-tabs.sh'
      - 'scripts/capture-mobile-tabs.sh'
      - 'scripts/shot.sh'
      - '.github/workflows/build-apks.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest ja traz o Android SDK em /usr/local/lib/android/sdk.
      # Nao usamos android-actions/setup-android: ele tenta instalar o pacote
      # "tools", que foi removido do repositorio do Google e faz o passo falhar
      # com "Failed to find package 'tools'".
      - name: Configurar Android SDK pre-instalado
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK em: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -5

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pillow (para checar screenshots)
        run: pip install --quiet pillow

      # Chave de assinatura. Gerada uma vez por execucao e publicada como
      # artefato para o dono do projeto guardar. Sem ela, uma atualizacao
      # futura nao pode ser instalada por cima da anterior.
      - name: Gerar chave de assinatura
        run: |
          keytool -genkeypair -v \
            -keystore movieflix-release.keystore \
            -alias movieflix \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}" \
            -dname "CN=MovieFlix, OU=Mobile, O=MovieFlix, L=Sao Paulo, ST=SP, C=BR"

      - name: Build mobile
        working-directory: mobile/android
        env:
          MF_KEYSTORE: ${{ github.workspace }}/movieflix-release.keystore
          MF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}
          MF_KEY_ALIAS: movieflix
          MF_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build TV
        working-directory: tv/android
        env:
          MF_KEYSTORE: ${{ github.workspace }}/movieflix-release.keystore
          MF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}
          MF_KEY_ALIAS: movieflix
          MF_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'movieflix2026' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Coletar APKs
        run: |
          mkdir -p out
          find mobile/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/movieflix-mobile-release.apk \;
          find tv/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/movieflix-tv-release.apk \;
          ls -lh out/

      # Prova que a UI realmente entrou no pacote. Se o R8 remover a arvore de
      # Compose, o app abre em tela preta — este passo falha antes de publicar.
      - name: Verificar conteudo dos APKs
        run: |
          python3 scripts/verify-apk.py out/movieflix-mobile-release.apk
          python3 scripts/verify-apk.py out/movieflix-tv-release.apk

      # ── Emulador: prova visual de que o app abre ───────────────────────────
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "sem /dev/kvm"

      - name: Rodar emulador e capturar telas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p screenshots

            # Dialogos de erro do sistema ("Pixel Launcher isn't responding")
            # aparecem por cima do app no emulador e poluem a evidencia.
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell settings put secure anr_show_background 0 || true

            echo "=== Instalando APK mobile ==="
            adb install -r out/movieflix-mobile-release.apk

            echo "=== Abrindo o app mobile ==="
            adb shell am start -n run.velixir.movieflix/.MainActivity
            sleep 15
            adb exec-out screencap -p > screenshots/mobile-home.png

            echo "=== Processo vivo? ==="
            adb shell pidof run.velixir.movieflix && echo "MOBILE VIVO" || echo "MOBILE MORTO"

            echo "=== Log de crash ==="
            adb logcat -d -b crash | tail -60 || true

            echo "=== Tela preta? ==="
            python3 scripts/check-screenshot.py screenshots/mobile-home.png "mobile home"

            # Cada aba da barra inferior, uma captura por tela.
            # O loop vive num .sh porque a action roda cada linha do script
            # num `sh -c` separado e um `for` inline chega sem o `done`.
            bash scripts/capture-mobile-tabs.sh screenshots

            echo "=== Instalando APK TV ==="
            adb install -r out/movieflix-tv-release.apk
            adb shell am start -n run.velixir.movieflix.tv/.MainActivity
            sleep 15
            adb exec-out screencap -p > screenshots/tv-home.png

            adb shell pidof run.velixir.movieflix.tv && echo "TV VIVO" || echo "TV MORTO"
            adb logcat -d -b crash | tail -40 || true

            python3 scripts/check-screenshot.py screenshots/tv-home.png "tv home"

            echo "=== Navegacao por D-pad na TV ==="
            adb shell input keyevent KEYCODE_DPAD_DOWN
            sleep 1
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 1
            adb exec-out screencap -p > screenshots/tv-focus.png
            echo "OK: D-pad respondeu"

      # ── Emulador de TV: prova visual em paisagem, com D-pad ────────────────
      # O emulador de celular roda o APK de TV, mas em retrato e sem controle.
      # Aqui usamos um perfil de TV (1080p paisagem) e navegamos só com D-pad,
      # que é a experiência real do usuário na televisão.
      - name: Rodar emulador de TV e capturar telas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p screenshots

            adb shell settings put global hide_error_dialogs 1 || true
            adb shell settings put secure anr_show_background 0 || true

            echo "=== Instalando APK TV ==="
            adb install -r out/movieflix-tv-release.apk

            echo "=== Abrindo o app de TV ==="
            adb shell am start -n run.velixir.movieflix.tv/.MainActivity
            sleep 18
            bash scripts/shot.sh screenshots/tv-real-home.png "tv real home"

            adb shell pidof run.velixir.movieflix.tv && echo "TV VIVO" || echo "TV MORTO"
            adb logcat -d -b crash | tail -40 || true


            echo "=== Navegacao por D-pad (sem toque) ==="
            adb shell input keyevent KEYCODE_DPAD_DOWN
            sleep 1
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 1
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 1
            bash scripts/shot.sh screenshots/tv-real-focus.png "tv real focus"
            python3 scripts/check-screenshot.py screenshots/tv-real-focus.png "tv real foco"

            echo "=== Botao Voltar ==="
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb exec-out screencap -p > screenshots/tv-real-back.png
            adb shell pidof run.velixir.movieflix.tv && echo "TV VIVO APOS VOLTAR" || echo "TV FECHOU NO VOLTAR"

            # ── Cada aba do menu lateral, uma captura por tela ───────────
            bash scripts/capture-tv-tabs.sh screenshots

            # ── Player: barrinha, OK (play/pause) e seta direita (avanço) ───────
            #
            # O app está deslogado no emulador, então o player normal mostra o
            # gate de conta. Para exercitar o player de verdade usamos a rota de
            # diagnóstico `mf_route embed`, que abre o provedor direto no
            # WebView — é o mesmo componente, com a mesma ponte JS.
            echo "=== Player: abrindo o embed direto ==="
            adb shell am force-stop run.velixir.movieflix.tv
            sleep 2
            adb shell am start -n run.velixir.movieflix.tv/.MainActivity \
              -e mf_route embed -e mf_tmdb 1292035
            sleep 25
            bash scripts/shot.sh screenshots/tv-player-1-aberto.png "player aberto"

            echo "=== Player: OK (play/pause) ==="
            adb shell input keyevent KEYCODE_DPAD_CENTER
            sleep 3
            bash scripts/shot.sh screenshots/tv-player-2-ok.png "player apos OK"

            echo "=== Player: seta direita (avancar) ==="
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 3
            bash scripts/shot.sh screenshots/tv-player-3-avancou.png "player apos seta direita"

            echo "=== Player: seta direita segurando (aceleracao) ==="
            adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT
            sleep 3
            bash scripts/shot.sh screenshots/tv-player-4-segurou.png "player apos segurar"

            adb shell pidof run.velixir.movieflix.tv && echo "TV VIVO NO PLAYER" || echo "TV MORTO NO PLAYER"
            adb logcat -d -b crash | tail -40 || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: movieflix-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movieflix-screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Upload chave de assinatura
        uses: actions/upload-artifact@v4
        with:
          name: movieflix-keystore
          path: movieflix-release.keystore
